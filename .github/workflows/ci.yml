# ───────────────────────────────────────────────────────────────────────────
# CI — der Smoke-Test lief bis hierher nur, wenn ihn jemand von Hand startete.
#
# Das Repo hatte keine CI und galt deshalb als das am schlechtesten belegte der
# acht. Gemessen ist das Gegenteil der Fall: `scripts/smoke-test.mjs` faehrt 38
# Pruefungen gegen einen laufenden Kern -- REST, Companion-Control-Endpunkt,
# WebSocket-Protokoll, PTT mit Auto-Release nach ActiveTime, Direktruf mit
# temporaerem Kanal, Anlegen und Loeschen von Kanaelen/Gruppen/Nutzern/Geraeten
# -- und sie sind gruen. Es fehlte nicht die Funktion, sondern die Automatik.
#
# Gestartet wird der GEBAUTE Server (`apps/server/dist/index.js`), nicht der
# `tsx watch`-Entwicklungslauf: in CI soll laufen, was der Build erzeugt, und
# ein Watcher haelt den Job unnoetig am Leben.
#
# `MOCK_DEVICES=1`, weil auf dem Runner keine Beltpacks haengen.
# ───────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Von Hand startbar. Gebraucht, als ein Pull Request geoeffnet wurde,
  # nachdem der Branch schon gepusht war: dann feuert weder `push`
  # (falscher Branch) noch verlaesslich `pull_request`, und die CI-Stufe
  # fehlte ganz — ein PR ohne Lauf sieht aus wie einer, auf den man noch
  # wartet.
  workflow_dispatch:

jobs:
  verify:
    name: Build + Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (shared + server + web)
        run: npm run build

      # Alle drei Dokumente unter docs/ waren bis 2026-09-04 von keiner
      # Einstiegsseite aus verlinkt -- auch docs/README.md selbst, das bereits
      # ein gutes Inhaltsverzeichnis war, das nur niemand verlinkte.
      - name: Dokumentation ist auffindbar
        run: npm run docs:reachable

      # Nutzer-Rueckmeldung 2026-09-07: "die ui ist nicht konsistent. lege
      # globale ui regeln fest die fuer alle repos gelten." Die Regeln stehen
      # in ADR-007 der av-planner-suite; dieser Check haelt sie hier.
      - name: Oberflaechen-Regeln (ADR-007)
        run: npm run brand:check

      # An den Reglern haengen Lautstaerke, VOX-Schwelle und
      # Kompressor-Schwelle einer LAUFENDEN Anlage. Wer im Betrieb
      # danebengreift, dreht am falschen Wert oder verreisst den getroffenen —
      # beides mitten in einer Sendung. WCAG 2.2 SC 2.5.8 nennt 24 px.
      - name: Schieberegler sind zu treffen (24 px, WCAG 2.5.8)
        run: npm run slider:check

      # Fragt die action.yml jedes Pins nach ihrer Node-Version, statt sie in
      # einem Kommentar zu behaupten. Am 2026-09-05 liefen hier BEIDE Actions
      # auf dem abgekuendigten node20, und niemandem ist es aufgefallen -- die
      # Warnung steht am Ende jedes Laufs, und genau deshalb liest sie keiner.
      - name: Actions laufen auf einer unterstuetzten Node-Version
        run: npm run actions:check

      # Bedarf 3 — die Companion-Tasten kommen aus dem Plan. Der
      # Integrationslauf des Moduls braucht einen Kern UND eine
      # Companion-Installation; die Ableitung braucht beides nicht. Ohne
      # diesen Schritt fande die einzige Pruefung der Tastenableitung nie
      # statt, und eine Pruefung, die nicht laeuft, ist keine.
      - name: Companion-Tasten kommen aus dem Plan
        run: npm run presets:check

      # Die Konfiguration ueberlebt einen Absturz waehrend des Speicherns.
      # `saveConfig` schrieb direkt auf die Zieldatei; ein Stromausfall
      # dabei hinterliess eine halbe Datei, und der Kern startete danach
      # nicht mehr. Der Lauf prueft das Verhalten, nicht den Quelltext.
      - name: Konfiguration wird atomar geschrieben
        run: npm run config:check

      # Softclient und PhoneClient sind zwei Ansichten derselben App am
      # selben Kern und rechneten den Mikrofon-Pegel mit ZWEI verschiedenen
      # Formeln, beide als „%" auf demselben Balken. Der Softclient
      # vergleicht seine VOX-Schwelle gegen diese Zahl.
      - name: Mikrofon-Pegel und PCM kommen aus einer Rechnung
        run: npm run audio:check

      # Der Plan-Import schreibt SPRECHBERECHTIGUNGEN. Sein Vertrag prueft
      # deshalb nicht nur, ob `version` eine Zahl ist, sondern welche — und
      # nennt jeden Eintrag, den er nicht lesen konnte, statt ihn still
      # wegzuwerfen.
      - name: Der Plan-Vertrag prueft die Bedeutung, nicht nur die Namen
        run: npm run plan:check

      # Defektformen-Sweep, Form `fixture-erreicht-grenze-nicht`: der
      # Smoke-Test beruehrt die Lautstaerke-Aktionen mit keiner seiner 58
      # Pruefungen. Die Grenze bei -60 dB — Stumm-Wert UND unteres Ende des
      # Bereichs — war deshalb nie erreicht, und Stumm war eine
      # Einbahnstrasse.
      - name: Lautstaerke und Stumm an ihrer Grenze
        run: npm run audio:control

      # Die Geraetebibliothek (devices.zumpelars.de): Einreichen und Import
      # lesen dasselbe Facet-Format, keine Projektdaten verlassen die Anlage,
      # der Abgleich ist inkrementell, das Token wird nie geloggt. Ohne
      # Vitest in diesem Repo ist das die einzige Pruefung der Anbindung.
      - name: Geraetebibliothek haelt ihren Vertrag
        run: npm run library:check

      # Quellsprache der Oberflaeche ist Englisch (E-28 der Suite), Deutsch
      # kommt aus i18n.tsx. Liest den Syntaxbaum, damit auch neue Ansichten
      # erfasst sind und nicht nur die, die schon einmal aufgefallen sind.
      - name: Oberflaechentexte kommen aus i18n (Quellsprache en)
        run: npm run lang:check

      # Das Erkennen der Stichwort-Regeln braucht kein Vosk: „go" darf nicht
      # in „going" ausloesen und nicht zweimal in einer Sekunde.
      - name: Stichwort-Regeln loesen nur bei ganzen Woertern aus
        run: npm run automation:check

      - name: Kern starten
        run: |
          MOCK_DEVICES=1 node apps/server/dist/index.js > /tmp/intercom.log 2>&1 &
          echo $! > /tmp/intercom.pid

      - name: Auf Bereitschaft warten
        run: |
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 http://localhost:4001/api/state >/dev/null 2>&1; then
              echo "Kern bereit nach ${i}s"
              exit 0
            fi
            # Stirbt der Prozess, ist Weiterwarten sinnlos -- dann lieber sofort
            # mit dem Log abbrechen, statt 60 Sekunden lang zu schweigen.
            if ! kill -0 "$(cat /tmp/intercom.pid)" 2>/dev/null; then
              echo "Kern ist gestorben:"
              cat /tmp/intercom.log
              exit 1
            fi
            sleep 1
          done
          echo "Kern wurde nicht bereit:"
          cat /tmp/intercom.log
          exit 1

      - name: Smoke-Test (88 Pruefungen)
        run: npm run test:smoke

      - name: Server-Log bei Fehlschlag
        if: failure()
        run: cat /tmp/intercom.log || true

      - name: Kern stoppen
        if: always()
        run: kill "$(cat /tmp/intercom.pid)" 2>/dev/null || true
